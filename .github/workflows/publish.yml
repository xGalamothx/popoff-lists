name: Validate and publish PopOff list index

on:
  push:
    branches:
      - main
    paths:
      - "*.popoff"
      - ".github/scripts/publish-index.js"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: popoff-list-index-main
  cancel-in-progress: false

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate signed packages and build index
        run: node .github/scripts/publish-index.js
      - name: Commit updated index
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: update verified PopOff list index"
          git push
